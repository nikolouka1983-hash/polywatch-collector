name: Polywatch Dry Run (Hourly)

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: bot.db
          key: botdb-${{ github.run_number }}
          restore-keys: |
            botdb-

      - name: Install dependencies
        run: pip install py-clob-client web3 --break-system-packages -q

      - name: Run dry run trade
        run: python3 bot.py trade
        env:
          POLYWATCH_DB: bot.db
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          DRY_RUN: 'true'

      - name: Show status
        run: python3 bot.py status
        env:
          POLYWATCH_DB: bot.db

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: bot.db
          key: botdb-${{ github.run_number }}

      - name: Upload bot log
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-log-${{ github.run_number }}
          path: bot.log
          retention-days: 30
          overwrite: true
