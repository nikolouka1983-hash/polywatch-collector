name: Polywatch Hourly Collector

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - summary

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download existing database
        uses: dawidd6/action-download-artifact@v3
        with:
          name: polywatch-database
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Run collector
        run: |
          if [ "${{ github.event.inputs.action }}" = "summary" ]; then
            python3 collector.py summary
          else
            python3 collector.py
          fi
        env:
          POLYWATCH_DB: polywatch.db
          POLYWATCH_LIMIT: "200"
          POLYWATCH_LOG: collector.log

      - name: Show collector log
        if: always()
        run: cat collector.log 2>/dev/null || echo "No log file"

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: polywatch-database
          path: |
            polywatch.db
            collector.log
          retention-days: 90
          overwrite: true

      - name: Upload weekly summary
        if: github.event.inputs.action == 'summary'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary
          path: summary_*.txt
          retention-days: 30
