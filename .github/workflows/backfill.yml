name: Polywatch Historical Backfill
on:
  workflow_dispatch:
    inputs:
      min_vol:
        description: 'Min volume per market'
        default: '10000'
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dawidd6/action-download-artifact@v3
        with: {name: polywatch-database, path: ., if_no_artifact_found: ignore}
        continue-on-error: true
      - run: python3 backfill.py --min-vol ${{ github.event.inputs.min_vol }} --resume
        env: {POLYWATCH_DB: polywatch.db}
      - uses: actions/upload-artifact@v4
        with: {name: polywatch-database, path: 'polywatch.db', retention-days: 90, overwrite: true}
